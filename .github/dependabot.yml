version: 2
updates:
  # Python: pyproject.toml + uv.lock (Dependabot splits these into pip/uv updates)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
  # GitHub Actions: .github/workflows/*.yml + action.yml
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
