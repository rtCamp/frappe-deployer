version: 2

# Only Python (pyproject.toml + uv.lock) and github-actions exist in this repo.
# The composer, npm, bundler, gomod, terraform and docker entries were scanning
# for manifests that are not here, so they only ever produced noise.
#
# The Python entry is "uv", not "pip": pip's file fetcher does not include
# uv.lock, so it only ever updates the ranges in pyproject.toml and the locked
# transitive versions stay behind. The one Dependabot PR that did update
# uv.lock came from the uv updater (dependabot/uv/gitpython-3.1.59).
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
