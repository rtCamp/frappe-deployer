version: 2

# Only pip (pyproject.toml + uv.lock) and github-actions exist in this repo.
# The composer, npm, bundler, gomod, terraform and docker entries were scanning
# for manifests that are not here, so they only ever produced noise.
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
