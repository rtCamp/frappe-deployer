[project]
site_name        = "Frappe Manager Deployer"
site_description = "Documentation for fmd — Zero-downtime Frappe deployments with atomic releases"
site_url         = "https://rtcamp.github.io/fmd/"
repo_name        = "rtcamp/fmd"
repo_url         = "https://github.com/rtcamp/fmd"
edit_uri         = "edit/main/docs/"
extra_css        = ["stylesheets/extra.css"]

# ---------------------------------------------------------------------------
# Navigation
# ---------------------------------------------------------------------------
nav = [
  { "Home" = "index.md" },
  { "Getting Started" = "getting-started.md" },
  { "Concepts" = "concepts.md" },
  { "Configuration" = "configuration.md" },
  { "Deploy Modes" = "deploy-modes.md" },
  { "GitHub Actions" = "github-actions.md" },
  { "Commands" = [
    "commands/index.md",
    { "fmd deploy"         = "commands/deploy.md" },
    { "fmd release"        = "commands/release.md" },
    { "fmd remote-worker"  = "commands/remote-worker.md" },
    { "fmd search-replace" = "commands/search-replace.md" },
    { "fmd cleanup"        = "commands/cleanup.md" },
  ]},
  { "Troubleshooting" = "troubleshooting.md" },
  { "FAQ"             = "faq.md" },
  { "Changelog"       = "changelog.md" },
]

# ---------------------------------------------------------------------------
# Theme — rtCamp Brand Inspired
# ---------------------------------------------------------------------------
[project.theme]
variant  = "modern"
language = "en"
logo     = "assets/logo.png"
favicon  = "assets/logo.png"
font = { text = "Reddit Sans, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif", code = "JetBrains Mono, Consolas, Monaco, monospace" }
features = [
  # Navigation
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.sections",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.path",
  "navigation.top",
  "navigation.footer",
  "navigation.tracking",
  # Search
  "search.highlight",
  "search.suggest",
  "search.share",
  # Content
  "content.code.copy",
  "content.code.annotate",
  "content.tabs.link",
  "content.tooltips",
  "content.action.edit",
  # TOC
  "toc.follow",
]

[project.theme.icon]
repo     = "fontawesome/brands/github"
edit     = "lucide/pencil"
previous = "lucide/chevron-left"
next     = "lucide/chevron-right"

# Light mode — rtCamp orange + purple accents
[[project.theme.palette]]
scheme      = "default"
primary     = "deep-orange"
accent      = "pink"

  [project.theme.palette.toggle]
  icon = "lucide/moon"
  name = "Switch to dark mode"

# Dark mode — rtCamp orange + purple accents
[[project.theme.palette]]
scheme      = "slate"
primary     = "deep-orange"
accent      = "pink"

  [project.theme.palette.toggle]
  icon = "lucide/sun"
  name = "Switch to light mode"

# ---------------------------------------------------------------------------
# Social links
# ---------------------------------------------------------------------------
[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/rtcamp/fmd"
name = "GitHub"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/frappe-deployer/"
name = "PyPI"

# ---------------------------------------------------------------------------
# Versioning — powered by mike
# ---------------------------------------------------------------------------
[project.extra.version]
provider = "mike"
alias    = true
default  = "latest"
